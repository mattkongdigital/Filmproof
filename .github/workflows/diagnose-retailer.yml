name: Diagnose retailer matching (manual, read-only)

# Fetches one retailer's live products.json and reports why each film-ish
# item does or doesn't identify against the parser. Read-only: no site data
# is written, no deploy happens. Manual trigger only.
on:
  workflow_dispatch:
    inputs:
      baseUrl:
        description: 'Retailer Shopify base URL'
        required: true
        default: 'https://camerasbymax.co.uk'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/diagnose-retailer.js "${{ github.event.inputs.baseUrl }}"
