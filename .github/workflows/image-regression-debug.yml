name: Image regression debug (manual)

# Manual only — press "Run workflow" in the Actions tab. Same reason as
# image-debug.yml: the diagnostic needs live shop data and the shops are
# unreachable from some environments, so the build runs here and the output is
# written to the run summary where it is readable without opening the logs.
#
# This one is the mirror image of image-debug.yml. That workflow reports what
# the filter REJECTED, for a single brand. This reports what it ACCEPTED, for
# every brand — because a promotional overlay that is back on the site got
# THROUGH the filter, and a list of successful rejections cannot show that.
#
# The diagnostic is FILMPROOF_IMAGE_REGRESSION_DEBUG in build-catalogue.js:
# for every product whose first image was accepted (not rejected by
# looksUnsuitable) it writes one stderr line giving the shop, the product
# title, the image URL and its alt text.
on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # A real live build pulls well over this many films. Anything less means the
  # retailer fetches fell back to the bundled samples — same threshold as
  # image-audit.yml. As in image-debug.yml a low count is reported and not
  # fatal: the output is still worth reading, it just isn't live data.
  MIN_FILMS: 100
  # Lines of diagnostic to put in the summary. The accepted-image list is much
  # longer than image-debug.yml's single-brand one (it is every product in the
  # catalogue), and the summary file has a size limit. The full log is uploaded
  # as an artifact either way, so a cap here loses nothing.
  SUMMARY_LINES: 800

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Root has no dependencies, so nothing to install (same as image-audit.yml).
      - name: Build catalogue with image regression debug
        env:
          FILMPROOF_IMAGE_REGRESSION_DEBUG: '1'
        run: |
          # stdout carries the per-source counts, stderr carries the diagnostic
          # (and any "live fetch failed" warnings). Keep them apart so the
          # summary can show the counts as evidence the build was real.
          status=0
          node build-catalogue.js >build.out 2>build.err || status=$?

          # "  Analogue Wonderland: +123 new films"
          counts=$(grep -E ': \+[0-9]+ new films' build.out || true)
          # "Catalogue: 456 unique films (from 789 film items)."
          total_line=$(grep -E '^Catalogue: [0-9]+ unique films' build.out | tail -n 1 || true)
          films=$(sed -nE 's/^Catalogue: ([0-9]+) unique films.*/\1/p' <<<"$total_line")
          failures=$(grep -E 'live fetch failed' build.err || true)
          # The diagnostic prefixes every line it writes, so filtering on it
          # keeps unrelated stderr noise out of the block below. Kept in a file
          # rather than a variable: the block feeds it to head, and piping a
          # large variable into head trips pipefail on SIGPIPE.
          grep -F '[image-regression]' build.err >accepted.log || true
          accepted_lines=$(wc -l <accepted.log)

          {
            echo "## Accepted product images"
            echo
            if [ -n "$counts" ]; then
              echo "### Films per source"
              echo
              echo '```'
              echo "$counts" | sed -E 's/^[[:space:]]+//'
              if [ -n "$total_line" ]; then echo "$total_line"; fi
              echo '```'
            else
              echo "### :x: No per-source counts"
              echo
              echo "\`build-catalogue.js\` reported no per-source film counts, so there is"
              echo "no way to confirm the build was real. Treat anything below with suspicion."
            fi

            if [ -n "$failures" ]; then
              echo
              echo "### :warning: Live fetches that failed"
              echo
              echo '```'
              echo "$failures" | sed -E 's/^[[:space:]]+//'
              echo '```'
            fi

            if [[ "$films" =~ ^[0-9]+$ ]] && [ "$films" -lt "$MIN_FILMS" ]; then
              echo
              echo "### :warning: This is probably not live data"
              echo
              echo "Only **$films films** were built, against an expected minimum of"
              echo "**$MIN_FILMS**. The live retailer fetches have most likely failed and the"
              echo "build has fallen back to the bundled sample data, so the lines below"
              echo "describe the samples rather than the real catalogue."
            fi

            echo
            echo "### Images the filter let through"
            echo
            if [ "$accepted_lines" -gt 0 ]; then
              echo "**$accepted_lines** products had their first image accepted."
              echo
              echo '```'
              head -n "$SUMMARY_LINES" accepted.log
              echo '```'
              if [ "$accepted_lines" -gt "$SUMMARY_LINES" ]; then
                echo
                echo "_Truncated: $accepted_lines lines in total, first $SUMMARY_LINES shown."
                echo "The full list is in the \`image-regression-debug\` artifact on this run._"
              fi
            else
              echo '```'
              echo "(no lines — the diagnostic produced no output)"
              echo '```'
              echo
              echo "Either no product's first image was accepted, or the build failed before"
              echo "reaching them. Check the step log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" -ne 0 ]; then
            echo "::error::build-catalogue.js exited with status $status — see the run summary and the log above."
            cat build.err
            exit "$status"
          fi

      # Always, so a failed build still hands over whatever it managed to write.
      - name: Upload full diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-regression-debug
          path: |
            accepted.log
            build.out
            build.err
          if-no-files-found: warn
