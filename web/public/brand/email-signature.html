<!--
  Filmproof email signature.

  Paste the block below into your mail client's HTML signature field. Fill in the
  four placeholders marked YOUR-… and delete any row you do not want.

  Table layout with inline styles only: Outlook's rendering engine ignores
  external CSS, flexbox and grid, so this is the shape that survives everywhere.

  The image URL works once the site is deployed. Until then, or if you would
  rather not depend on the site being up, delete the <img> line and paste
  filmproof-signature-white.png in its place, resized to 300px wide.
-->
<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif">
  <tr>
    <td style="padding:0 0 10px">
      <a href="https://filmproof.co.uk" style="text-decoration:none">
        <img src="https://filmproof.co.uk/brand/filmproof-signature-white.png"
             alt="Filmproof" width="300" height="100"
             style="display:block;border:0;outline:none;text-decoration:none">
      </a>
    </td>
  </tr>
  <tr>
    <td style="padding:10px 0 0;border-top:1px solid #dddddd">
      <div style="font-size:14px;line-height:20px;color:#1a1811;font-weight:bold">YOUR NAME</div>
      <div style="font-size:13px;line-height:19px;color:#666666">YOUR ROLE</div>
      <div style="font-size:13px;line-height:19px;color:#666666;padding-top:6px">
        <a href="mailto:YOUR@EMAIL" style="color:#666666;text-decoration:none">YOUR@EMAIL</a>
        &nbsp;·&nbsp;
        <a href="https://filmproof.co.uk" style="color:#e8532e;text-decoration:none">filmproof.co.uk</a>
      </div>
    </td>
  </tr>
</table>
