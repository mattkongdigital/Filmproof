name: Refresh prices & deploy

# Each run re-pulls live prices, rebuilds the static site, and publishes it to
# GitHub Pages. There is deliberately no `schedule:` here. GitHub started this
# workflow's daily cron 6 to 10 hours late and sometimes not at all, so the
# daily refresh is a Claude Code scheduled task on the owner's plan that
# starts it through workflow_dispatch every morning at 05:38 UK time.
on:
  workflow_dispatch: {}    # the daily refresh, and the "Run workflow" button
  push:
    branches: [main]       # also rebuild when you push code changes

# Permissions the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The snapshot of the last deployed catalogue, and the shop-update news
      # log, from the catalogue-state branch (see "News" in CLAUDE.md). No
      # branch yet means a first run: build-news.js seeds it and posts nothing.
      - name: Fetch catalogue state
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin catalogue-state >/dev/null; then
            git fetch --depth=1 origin catalogue-state
            git archive FETCH_HEAD | tar -x -C state
            echo "Catalogue state from $(git log -1 --format=%cI FETCH_HEAD)"
          else
            echo "No catalogue-state branch yet; this run seeds it."
          fi

      # Rebuild the canonical catalogue AND pull fresh prices from every live
      # source, regenerating web/data/site.json + search-index.json from scratch,
      # then diff it against the snapshot for the news feed.
      # (Root has no dependencies, so nothing to install for this step.)
      - name: Refresh catalogue & price data
        run: |
          node build-catalogue.js
          node build-site-data.js
          node build-news.js

      # Handed to save-state, which commits it only once the deploy succeeds.
      - uses: actions/upload-artifact@v4
        with:
          name: catalogue-state
          path: state/
          retention-days: 7
          if-no-files-found: error

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Build static site
        working-directory: web
        env:
          # Custom domain (filmproof.co.uk) serves from the root, so no base path.
          # If you ever deploy WITHOUT a custom domain, set this to
          # /${{ github.event.repository.name }} instead.
          PAGES_BASE_PATH: ''
        run: npm run build

      # Tell GitHub Pages which custom domain to serve on.
      - name: Set custom domain
        run: echo 'filmproof.co.uk' > web/out/CNAME

      # Jekyll would otherwise drop Next's _next/ folder and break all assets.
      - name: Disable Jekyll
        run: touch web/out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Commit the new snapshot and news log to the catalogue-state branch, only
  # after the site that matches them is live. If the deploy fails, the next run
  # diffs against the last snapshot that actually went out, so no change is
  # lost or posted twice. A push made with GITHUB_TOKEN starts no workflow, and
  # this branch is not main, so it cannot re-trigger this one.
  save-state:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: catalogue-state
          path: ${{ runner.temp }}/state

      - name: Commit to catalogue-state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin catalogue-state >/dev/null; then
            git fetch --depth=1 origin catalogue-state
            git switch -C catalogue-state FETCH_HEAD
          else
            git switch --orphan catalogue-state
          fi
          # Replace the branch's files wholesale with this run's state.
          git rm -rq --ignore-unmatch .
          cp -r "$RUNNER_TEMP/state/." .
          git add -A
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git commit -q -m "Catalogue state from run ${{ github.run_id }}"
          git push origin HEAD:catalogue-state
